http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 30M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_vary on;

    map $http_origin $cors_header {
        default "";
        "https://yours-scently-fe.vercel.app" $http_origin;
        "https://www.yours-scently.store"     $http_origin;
        "https://yours-scently.store"         $http_origin;
        "http://localhost:3000"               $http_origin;   # 로컬 개발용
        "http://127.0.0.1:3000"               $http_origin;   # 로컬 개발용
    }

    upstream django_server {
        server web:8000;   # docker-compose 서비스명
    }

    # HTTP → HTTPS 리디렉션
    server {
        listen 80;
        server_name yours-scently.store www.yours-scently.store;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 서버
    server {
        listen 443 ssl;
        server_name yours-scently.store www.yours-scently.store;

        ssl_certificate /etc/letsencrypt/live/yours-scently.store/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yours-scently.store/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # API 및 웹 요청
        location / {
            if ($request_method = OPTIONS) {
                if ($cors_header = "") {
                    return 403;
                }

                add_header 'Access-Control-Allow-Origin' $cors_header always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-CSRFToken' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' text/plain;
                return 204;
            }

            proxy_pass http://django_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;

            if ($cors_header != "") {
                add_header 'Access-Control-Allow-Origin' $cors_header always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
            }
        }

        # 정적 파일
        location /static/ {
            alias /yours_scently/app/static/;
            autoindex off;
            expires 1d;
            access_log off;
        }

        # 미디어 파일
        location /media/ {
            alias /yours_scently/app/media/;
            autoindex off;
            expires 1d;
            access_log off;
        }
    }
}